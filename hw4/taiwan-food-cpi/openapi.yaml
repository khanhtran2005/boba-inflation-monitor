openapi: 3.0.3
info:
  title: 清心福全通膨觀測站 API
  description: >
    Web API for tracking drink price changes at the 清心福全 (Chingshin) bubble tea chain.
    Backend uses Express.js with SQLite for data storage.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: prices
    description: Manage drink price records

paths:

  /api/prices:
    get:
      tags: [prices]
      summary: Get all price records
      description: >
        Returns all records from the prices table, sorted by date descending.
        Supports filtering by drink name via the query parameter `q`.
      parameters:
        - name: q
          in: query
          required: false
          description: Search keyword for drink name (item_name LIKE %q%)
          schema:
            type: string
            example: 珍珠奶茶
      responses:
        '200':
          description: List of price records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceRecord'
              examples:
                all:
                  summary: All records
                  value:
                    - id: 2
                      date: "2024-07-26"
                      item_name: 珍珠奶茶
                      price: 55
                    - id: 1
                      date: "2024-01-15"
                      item_name: 珍珠奶茶
                      price: 50
                filtered:
                  summary: Filtered result with q=珍珠
                  value:
                    - id: 2
                      date: "2024-07-26"
                      item_name: 珍珠奶茶
                      price: 55
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorJson'

  /api/insert:
    post:
      tags: [prices]
      summary: Add a new price record
      description: Inserts a new record into the prices table with date, drink name, and price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceInput'
            example:
              date: "2024-09-01"
              item_name: 珍珠奶茶
              price: 60
      responses:
        '200':
          description: Record added successfully, returns plain text
          content:
            text/plain:
              schema:
                type: string
              example: "新增成功！已新增「珍珠奶茶」，價格 NT$60，日期 2024-09-01"
        '400':
          description: Missing required fields
          content:
            text/plain:
              schema:
                type: string
              example: "新增失敗：請填寫完整的日期、商品名稱和價格！"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string

  /api/prices/{id}:
    delete:
      tags: [prices]
      summary: Delete a record by ID
      description: Deletes the record with the given ID from the prices table.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the record to delete
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Record deleted successfully, returns plain text
          content:
            text/plain:
              schema:
                type: string
              example: "已成功刪除 1 筆資料"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    PriceRecord:
      type: object
      properties:
        id:
          type: integer
          description: Auto-increment primary key
          example: 1
        date:
          type: string
          format: date
          description: Date the price was recorded (YYYY-MM-DD)
          example: "2024-07-26"
        item_name:
          type: string
          description: Drink name
          example: 珍珠奶茶
        price:
          type: number
          description: Price in NT$
          example: 55

    PriceInput:
      type: object
      required: [date, item_name, price]
      properties:
        date:
          type: string
          format: date
          description: Date the price was recorded (YYYY-MM-DD)
          example: "2024-09-01"
        item_name:
          type: string
          description: Drink name
          example: 珍珠奶茶
        price:
          type: number
          description: Price in NT$
          example: 60

    ErrorJson:
      type: object
      properties:
        error:
          type: string
          example: "SQLITE_ERROR: no such table"
