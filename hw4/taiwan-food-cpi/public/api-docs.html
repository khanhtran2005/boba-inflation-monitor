<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Docs — 清心福全通膨觀測站</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        body { margin: 0; background: #f0f9f4; }

        /* Top bar */
        .topbar-custom {
            background: linear-gradient(135deg, #005C28, #00873C, #43C678);
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar-custom a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }
        .topbar-custom a:hover { color: #fff; }
        .topbar-title {
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Hide default swagger topbar */
        .swagger-ui .topbar { display: none; }

        /* Minor styling tweaks */
        .swagger-ui .info .title { color: #00873C; }
        .swagger-ui .opblock.opblock-get    .opblock-summary-method { background: #00873C; }
        .swagger-ui .opblock.opblock-post   .opblock-summary-method { background: #0066cc; }
        .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #EF4444; }
        .swagger-ui .btn.execute { background: #00873C; border-color: #00873C; }
        .swagger-ui .btn.execute:hover { background: #006B2E; }
    </style>
</head>
<body>
    <div class="topbar-custom">
        <div class="topbar-title">📄 API Specification — 清心福全通膨觀測站</div>
        <a href="/">← 回主頁 Back to App</a>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        SwaggerUIBundle({
            url: '/openapi.yaml',
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIBundle.SwaggerUIStandalonePreset
            ],
            layout: 'BaseLayout',
            tryItOutEnabled: true,
        });
    </script>
</body>
</html>
