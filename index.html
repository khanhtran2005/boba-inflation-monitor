<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube - 伺服器維護中</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="floating-bg">
  <span>⚙️</span><span>🍌</span><span>🔧</span><span>🐒</span><span>⚙️</span>
  <span>🍌</span><span>🔧</span><span>⚠️</span><span>🐒</span><span>⚙️</span>
</div>

<div class="app-body">
  <main class="main-content">
    <div class="error-container">

      <div class="center-logo">
        <div class="yt-icon-box-lg"></div>
        <span class="yt-text-lg">YouTube</span>
      </div>

      <div class="empathy-header">
        <div class="error-badge">
          <div class="badge-dot"></div>
          500 內部伺服器錯誤
        </div>
        <h1>🔧 我們的小猴子工程師正在全力搶修！</h1>
        <h2>YouTube <span>暫時休息中</span>，感謝您的耐心等候</h2>
      </div>

      <div class="reassurance-box">
        <div class="r-row">
          <span class="r-icon">🔒</span>
          <span>請放心，您的<b>帳戶、播放清單和訂閱內容</b>都非常安全，完全不受影響。</span>
        </div>
        <div class="r-row">
          <span class="r-icon">⏱️</span>
          <span>您的<b>觀看紀錄</b>也完整保留，待系統恢復後即可繼續。</span>
        </div>
        <div class="r-row">
          <span class="r-icon">🍿</span>
          <span>工程師們正全力搶修，<b>稍後重試</b>即可！</span>
        </div>
      </div>

      <div class="interactive-area">
        <div class="broken-tv" id="stressReliefBtn">
          <div class="tv-screen" id="tvScreen">
            <div class="tv-static"></div>
            <div class="tv-play" id="tvPlay">▶</div>
          </div>
          <div class="click-badge" id="clickBadge">0</div>
        </div>

        <div class="energy-wrap">
          <div class="energy-header">
            <span class="energy-label">⚡ 修復進度</span>
            <span class="energy-pct" id="energyPct">100%</span>
          </div>
          <div class="energy-track">
            <div class="energy-fill" id="energyFill"></div>
            <div class="energy-glow"></div>
          </div>
          <div class="energy-status" id="energyStatus">🔧 工程師正在搶修中...</div>
        </div>

        <p class="hint-text" id="hintMessage">💡 提示：點擊上方電視來發洩心中的不滿吧！</p>

        <div class="action-btns">
          <button class="btn-primary" onclick="handleRetry()">立即重試</button>
          <button class="btn-secondary" onclick="window.location.reload()">返回首頁</button>
        </div>
      </div>

    </div>
  </main>
</div>

<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
